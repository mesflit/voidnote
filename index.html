<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voidnote</title>
    <!-- Google Fonts & Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Marked.js for Markdown Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --md-sys-color-primary: #ff5252;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-primary-container: #3b1d1d;
            --md-sys-color-surface: #121212;
            --md-sys-color-card: #1e1e1e;
            --md-sys-color-on-surface: #e0e0e0;
            --md-sys-color-outline: #424242;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--md-sys-color-card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            border: 1px solid var(--md-sys-color-outline);
            text-align: center;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--md-sys-color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .input-container {
            position: relative;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        textarea, input[type="password"] {
            width: 100%;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--md-sys-color-outline);
            background-color: #2a2a2a;
            color: var(--md-sys-color-on-surface);
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Roboto', sans-serif;
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        textarea:focus, input[type="password"]:focus {
            border-color: var(--md-sys-color-primary);
            border-width: 2px;
        }

        button {
            width: 100%;
            padding: 0.85rem;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(255, 82, 82, 0.3);
            transition: background-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: #ff1744;
            box-shadow: 0 4px 10px rgba(255, 82, 82, 0.5);
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: var(--md-sys-color-primary-container);
            border-radius: 0.75rem;
            word-break: break-all;
            display: none;
            text-align: left;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 82, 82, 0.2);
        }

        .result p {
            margin: 0 0 0.5rem 0;
            font-weight: 500;
            color: #ff8a80;
        }

        .result a {
            color: var(--md-sys-color-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .result a:hover {
            text-decoration: underline;
        }

        /* Markdown Çıktı Tasarımı */
        .note-display {
            background-color: #2a2a2a;
            padding: 1.25rem;
            border-radius: 0.5rem;
            border: 1px solid var(--md-sys-color-outline);
            text-align: left;
            margin-top: 1rem;
            color: #ffffff;
            max-height: 400px;
            overflow-y: auto;
        }

        .note-display h1, .note-display h2, .note-display h3 {
            color: var(--md-sys-color-primary);
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .note-display code {
            background-color: #1a1a1a;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            color: #ff8a80;
        }

        .note-display pre {
            background-color: #1a1a1a;
            padding: 0.75rem;
            border-radius: 4px;
            overflow-x: auto;
        }

        .note-display pre code {
            background-color: transparent;
            padding: 0;
            color: #e0e0e0;
        }

        .note-display blockquote {
            border-left: 4px solid var(--md-sys-color-primary);
            margin-left: 0;
            padding-left: 1rem;
            color: #b0b0b0;
        }

        .note-display ul, .note-display ol {
            padding-left: 1.5rem;
        }

        .note-display a {
            color: var(--md-sys-color-primary);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Okuma / Çözme Görünümü -->
        <div id="decryptView" style="display: none;">
            <h2>
                <span class="material-icons">lock_open</span>
                Voidnote
            </h2>
            <div id="passwordPrompt">
                <p style="color: #b0b0b0; font-size: 0.95rem; margin-bottom: 1rem;">This note is protected with a password. Enter it below to read:</p>
                <div class="input-container">
                    <input type="password" id="decryptPassword" placeholder="Enter password">
                </div>
                <button onclick="decryptNote()">
                    <span class="material-icons">visibility</span>
                    Unlock Note
                </button>
            </div>
            
            <div id="noteContainer" style="display: none;">
                <p style="color: #ff8a80; font-weight: 500; margin-bottom: 0.2rem; text-align: left;">Decrypted Message:</p>
                <div class="note-display" id="decryptedText"></div>
            </div>
        </div>

        <!-- Oluşturma Görünümü -->
        <div id="generatorView">
            <h2>
                <span class="material-icons">security</span>
                Voidnote
            </h2>
            <div class="input-container">
                <textarea id="noteInput" placeholder="Type your secret message here (Markdown supported)..."></textarea>
            </div>
            <div class="input-container">
                <input type="password" id="passInput" placeholder="Encryption Password (Optional)">
            </div>
            <button onclick="createSecureLink()">
                <span class="material-icons">vpn_key</span>
                Create Secure Link
            </button>

            <div class="result" id="resultBox">
                <p>Your Secure Link:</p>
                <a id="shortenedLink" href="#" target="_blank"></a>
            </div>
        </div>
    </div>

    <!-- CryptoJS Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const hash = window.location.hash.substring(1);

            if (hash) {
                document.getElementById('decryptView').style.display = 'block';
                document.getElementById('generatorView').style.display = 'none';
            }
        });

        function createSecureLink() {
            const note = document.getElementById('noteInput').value.trim();
            const password = document.getElementById('passInput').value;

            if (!note) {
                alert('Please enter a secret message.');
                return;
            }

            const secretKey = password ? password : 'VoidnoteDefaultKey2026';
            const encryptedData = CryptoJS.AES.encrypt(note, secretKey).toString();
            const encodedData = btoa(encodeURIComponent(encryptedData));

            const baseUrl = window.location.origin + window.location.pathname;
            const secureUrl = `${baseUrl}#${encodedData}`;

            const resultBox = document.getElementById('resultBox');
            const shortenedLink = document.getElementById('shortenedLink');
            
            shortenedLink.href = secureUrl;
            shortenedLink.innerText = secureUrl;
            resultBox.style.display = 'block';
        }

        function decryptNote() {
            const hash = window.location.hash.substring(1);
            const password = document.getElementById('decryptPassword').value;

            if (!hash) return;

            try {
                const decodedData = decodeURIComponent(atob(hash));
                const secretKey = password ? password : 'VoidnoteDefaultKey2026';

                const bytes = CryptoJS.AES.decrypt(decodedData, secretKey);
                const originalMessage = bytes.toString(CryptoJS.enc.Utf8);

                if (!originalMessage) {
                    throw new Error('Wrong password');
                }

                document.getElementById('passwordPrompt').style.display = 'none';
                document.getElementById('noteContainer').style.display = 'block';
                
                // Markdown içeriğini HTML'e çevirip ekrana basıyoruz
                document.getElementById('decryptedText').innerHTML = marked.parse(originalMessage);

            } catch (e) {
                alert('Incorrect password or corrupted link!');
            }
        }
    </script>
</body>
</html>
